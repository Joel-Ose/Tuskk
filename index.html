<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tusk — A clean, distraction-free task management app. Focus on what matters." />
  <title>Tusk — Focus on what matters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="header" id="app-header">
      <div class="header-brand">
        <div class="logo" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="#3B82F6"/>
            <path d="M10 13H26M10 13V11C10 10.4477 10.4477 10 11 10H25C25.5523 10 26 10.4477 26 11V13M10 13L12 26C12 26.5523 12.4477 27 13 27H23C23.5523 27 24 26.5523 24 26L26 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 17L17 22L21 15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Tusk</h1>
          <p class="header-tagline">Focus on what matters.</p>
        </div>
      </div>
    </header>

    <!-- Main Content / Dashboard -->
    <main class="main" id="main-content">

      <!-- Statistics -->
      <section class="stats-section" id="stats-section">
        <div class="stat-card" id="stat-total">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-card" id="stat-completed">
          <span class="stat-value" id="completed-count">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card stat-card-progress" id="stat-progress">
          <span class="stat-value" id="progress-percent">0%</span>
          <span class="stat-label">Progress</span>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
        </div>
      </section>

      <!-- Tasks Section -->
      <section class="tasks-section" id="tasks-section">
        <div class="tasks-toolbar">
          <div class="tasks-toolbar-left">
            <h2 class="tasks-title">Tasks</h2>
            <div class="tasks-filter" id="tasks-filter" role="tablist">
              <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true" id="filter-all">All</button>
              <button class="filter-btn" data-filter="active" role="tab" aria-selected="false" id="filter-active">Active</button>
              <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false" id="filter-completed">Done</button>
            </div>
          </div>
          <button class="btn btn-primary btn-add-task" id="add-task-btn" aria-label="Add a new task">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add Task
          </button>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="task-list" role="list">
          <!-- Tasks rendered by JS -->
        </ul>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="36" cy="36" r="32" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>
              <rect x="22" y="24" width="28" height="3" rx="1.5" fill="#E5E7EB"/>
              <rect x="22" y="32" width="20" height="3" rx="1.5" fill="#E5E7EB"/>
              <rect x="22" y="40" width="24" height="3" rx="1.5" fill="#E5E7EB"/>
              <path d="M28 36L34 42L44 30" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
            </svg>
          </div>
          <p class="empty-title">No tasks yet.</p>
          <p class="empty-subtitle">Add your first task to get started.</p>
          <button class="btn btn-primary btn-empty-add" id="empty-add-btn">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add Task
          </button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="app-footer">
      <p>Built with care. Stay productive.</p>
    </footer>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" id="task-modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add Task</h2>
        <button class="modal-close" id="modal-close-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <form class="modal-form" id="task-form" autocomplete="off">
        <input type="hidden" id="task-edit-id" value="" />

        <!-- Task Name -->
        <div class="form-group">
          <label class="form-label" for="task-name">Task Name <span class="required">*</span></label>
          <input
            type="text"
            class="form-input"
            id="task-name"
            placeholder="What needs to be done?"
            maxlength="200"
            required
          />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label" for="task-desc">Description</label>
          <textarea
            class="form-textarea"
            id="task-desc"
            placeholder="Add details or notes…"
            rows="3"
            maxlength="500"
          ></textarea>
        </div>

        <!-- Category & Due Date row -->
        <div class="form-row">
          <!-- Category -->
          <div class="form-group form-group-half">
            <label class="form-label" for="task-category">Category</label>
            <div class="category-picker" id="category-picker">
              <button type="button" class="cat-pill active" data-category="none">None</button>
              <button type="button" class="cat-pill" data-category="work">
                <span class="cat-dot" style="background:#3B82F6"></span>Work
              </button>
              <button type="button" class="cat-pill" data-category="personal">
                <span class="cat-dot" style="background:#8B5CF6"></span>Personal
              </button>
              <button type="button" class="cat-pill" data-category="health">
                <span class="cat-dot" style="background:#22C55E"></span>Health
              </button>
              <button type="button" class="cat-pill" data-category="shopping">
                <span class="cat-dot" style="background:#F59E0B"></span>Shopping
              </button>
              <button type="button" class="cat-pill" data-category="finance">
                <span class="cat-dot" style="background:#14B8A6"></span>Finance
              </button>
            </div>
          </div>
        </div>

        <!-- Due Date & Reminder -->
        <div class="form-row">
          <div class="form-group form-group-half">
            <label class="form-label" for="task-due">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px;opacity:0.5">
                <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M8 4.5V8L10.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>Due Date
            </label>
            <input type="datetime-local" class="form-input form-input-date" id="task-due" />
          </div>
          <div class="form-group form-group-half">
            <label class="form-label">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:4px;opacity:0.5">
                <path d="M6 13.5C6 13.5 6.5 14.5 8 14.5C9.5 14.5 10 13.5 10 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M3.5 10.5C3.5 10.5 4 9.5 4 7.5C4 5.29086 5.79086 3.5 8 3.5C10.2091 3.5 12 5.29086 12 7.5C12 9.5 12.5 10.5 12.5 10.5H3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="8" y1="1.5" x2="8" y2="3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>Reminder
            </label>
            <div class="reminder-row">
              <label class="toggle-switch" for="task-reminder">
                <input type="checkbox" id="task-reminder" />
                <span class="toggle-slider"></span>
              </label>
              <span class="reminder-label" id="reminder-label">Off</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save-btn">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8L7 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Save Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>

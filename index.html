<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tusk — A clean, distraction-free task management app. Focus on what matters." />
  <title>Tusk — Focus on what matters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="header" id="app-header">
      <div class="header-brand">
        <div class="logo" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="#3B82F6"/>
            <path d="M10 13H26M10 13V11C10 10.4477 10.4477 10 11 10H25C25.5523 10 26 10.4477 26 11V13M10 13L12 26C12 26.5523 12.4477 27 13 27H23C23.5523 27 24 26.5523 24 26L26 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 17L17 22L21 15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Tusk</h1>
          <p class="header-tagline">Focus on what matters.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main" id="main-content">
      <!-- Task Input -->
      <section class="input-section" id="input-section">
        <form class="input-form" id="task-form" autocomplete="off">
          <input
            type="text"
            class="task-input"
            id="task-input"
            placeholder="What needs to be done?"
            aria-label="Enter a new task"
            maxlength="200"
          />
          <button type="submit" class="btn btn-primary" id="add-task-btn">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add Task
          </button>
        </form>
      </section>

      <!-- Statistics -->
      <section class="stats-section" id="stats-section">
        <div class="stat-card" id="stat-total">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-card" id="stat-completed">
          <span class="stat-value" id="completed-count">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card stat-card-progress" id="stat-progress">
          <span class="stat-value" id="progress-percent">0%</span>
          <span class="stat-label">Progress</span>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
        </div>
      </section>

      <!-- Task List -->
      <section class="tasks-section" id="tasks-section">
        <div class="tasks-header">
          <h2 class="tasks-title">Tasks</h2>
          <div class="tasks-filter" id="tasks-filter" role="tablist">
            <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true" id="filter-all">All</button>
            <button class="filter-btn" data-filter="active" role="tab" aria-selected="false" id="filter-active">Active</button>
            <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false" id="filter-completed">Done</button>
          </div>
        </div>

        <!-- Task List Container -->
        <ul class="task-list" id="task-list" role="list">
          <!-- Tasks injected dynamically -->
        </ul>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="32" r="28" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>
              <path d="M24 32L30 38L40 26" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
              <rect x="20" y="22" width="24" height="3" rx="1.5" fill="#E5E7EB"/>
              <rect x="20" y="30" width="18" height="3" rx="1.5" fill="#E5E7EB"/>
              <rect x="20" y="38" width="21" height="3" rx="1.5" fill="#E5E7EB"/>
            </svg>
          </div>
          <p class="empty-title">No tasks yet.</p>
          <p class="empty-subtitle">Add your first task to get started.</p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="app-footer">
      <p>Built with care. Stay productive.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
